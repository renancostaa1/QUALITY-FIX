    --seq-250:#86b6ef; --seq-350:#5598e7; --seq-450:#2a78d6; --seq-550:#1c5cab; --seq-600:#184f95;

    :root:not([data-theme="light"]){

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{

  .app{ display:flex; min-height:100vh; }

  /* Sidebar */
  .sidebar{
    width:246px; flex:0 0 auto; background:var(--surface-2);

  .brand-name{ font-weight:800; font-size:15px; letter-spacing:-0.01em; line-height:1.1; }

  .nav-group-label{ font-size:10.5px; font-weight:700; letter-spacing:0.09em; text-transform:uppercase; color:var(--ink-muted); padding:0 10px; margin-bottom:4px; }
  .nav-item{
    display:flex; align-items:center; gap:9px; width:100%; text-align:left;
    padding:8px 10px; border-radius:9px; border:none; background:transparent;
    color:var(--ink-secondary); font-size:13.5px; font-weight:600; cursor:pointer;
    transition:background .12s ease, color .12s ease;
  }
  .nav-item:hover{ background:var(--border); color:var(--ink-primary); }
  .nav-item.active{ background:var(--accent); color:var(--accent-ink); }
  .nav-item .dot{ width:6px; height:6px; border-radius:50%; background:currentColor; opacity:.55; flex:0 0 auto; }

  .nav-badge{

  .stat-tile{

  table.data-table{ width:100%; border-collapse:collapse; font-size:12.5px; min-width:640px; }

    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.05em; color:var(--ink-muted);
    font-weight:700; padding:9px 10px; border-bottom:1px solid var(--grid); white-space:nowrap;

  table.data-table td{ padding:10px 10px; border-bottom:1px solid var(--grid); color:var(--ink-secondary); white-space:nowrap; }
  table.data-table td.strong{ color:var(--ink-primary); font-weight:600; }
  table.data-table tr:last-child td{ border-bottom:none; }
  table.data-table tr:hover td{ background:var(--surface-2); }

  .pill{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; padding:3px 9px; border-radius:20px; }
  .pill::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
  .pill.good{ color:var(--good); background:var(--good-bg); }
  .pill.warning{ color:#8a5a00; background:var(--warning-bg); }
  :root:not([data-theme="light"]) .pill.warning{ color:var(--warning); }
  :root[data-theme="dark"] .pill.warning{ color:var(--warning); }
  .pill.serious{ color:var(--serious); background:var(--serious-bg); }
  .pill.critical{ color:var(--critical); background:var(--critical-bg); }
  .pill.neutral{ color:var(--ink-secondary); background:var(--border); }

  .section-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .section-head h2{ font-size:16px; font-weight:800; }
  .section-head p{ font-size:12.5px; color:var(--ink-muted); margin:2px 0 0; }
  .table-note{ font-size:11px; color:var(--ink-muted); padding:10px 18px 0; }

  .schema-panel{ display:none; font-size:11.5px; color:var(--ink-secondary); line-height:1.6; padding:10px; background:var(--surface-2); border-radius:9px; margin-top:8px; }
  .schema-panel.open{ display:block; }
  .schema-panel code{ font-family:"IBM Plex Mono",monospace; color:var(--accent); font-size:10.5px; }

  @media (max-width: 980px){
    .sidebar{ position:static; height:auto; width:100%; flex-direction:row; overflow-x:auto; align-items:center; padding:10px 12px; }

    .nav-group-label{ display:none; }
    .sidebar-foot{ display:none; }
    .app{ flex-direction:column; }
    .grid-2, .grid-3{ grid-template-columns:1fr; }
    .kpi-row{ grid-template-columns:repeat(2,1fr); }
    #content{ padding:18px 16px 48px; }
    .topbar{ padding:14px 16px; }
  }
</style>

function mulberry32(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
let rand = mulberry32(20260925);
const ri = (a,b)=> Math.floor(rand()*(b-a+1))+a;

function weightedPick(items, w){
  const total = items.reduce((s,it)=>s+w(it),0);
  let r = rand()*total;
  for(const it of items){ r -= w(it); if(r<=0) return it; }
  return items[items.length-1];
}
function clamp(n,a,b){ return Math.max(a,Math.min(b,n)); }

const DIAS_PARA_INATIVAR = 90; // regra de negócio: 90 dias sem comprar = inativo

function buildClientes(nomes){
  return nomes.map((nome,i)=>{
    const cid = weightedPick(CIDADES, c=>c.peso);
    const vendedor = pick(VENDEDORES);
    const diasCadastro = ri(15,1100);
    const dataCadastro = addDays(HOJE, -diasCadastro);
    const isLead = rand()<0.11; // nunca converteu em comprador (Em Desenvolvimento)

    let dataAtivacao = null, cutoffOffset = 0;
    if(!isLead){
      const gapAtivacao = ri(2, Math.max(2, Math.min(60, diasCadastro)));
      dataAtivacao = addDays(dataCadastro, gapAtivacao);
      // cliente com tempo de casa suficiente pode ter parado de comprar há 90+ dias
      const podeFicarInativo = diasCadastro > DIAS_PARA_INATIVAR+10;
      if(podeFicarInativo && rand()<0.32){
        cutoffOffset = ri(DIAS_PARA_INATIVAR+1, Math.min(130, diasCadastro-5));
      }
    }

    return {
      id:'CLI-'+String(1000+i),
      razaoSocial:nome,
      tipo:'PJ',
      situacao: isLead? 'Em Desenvolvimento' : 'Ativo', // provisório — recalculado após gerar os pedidos
      segmento: pick(SEGMENTOS),
      tipoVenda: pick(TIPOS_VENDA),
      cidade:cid.cidade, estado:cid.estado, regiao:cid.regiao,
      vendedor,
      dataCadastro, dataAtivacao, dataAlteracao: dataCadastro,
      cutoffOffset,
    };
  });
}

function deriveStatusClientes(){
  const stats = statsClientes();
  CLIENTES.forEach(c=>{
    if(!c.dataAtivacao){ c.situacao = 'Em Desenvolvimento'; return; }
    const ultimoOffset = stats[c.id].ultimoOffset;
    if(ultimoOffset===null || ultimoOffset>=DIAS_PARA_INATIVAR){
      c.situacao = 'Inativo';
      const dataUltimaCompra = ultimoOffset===null ? c.dataAtivacao : addDays(HOJE,-ultimoOffset);
      const dataInativacao = addDays(dataUltimaCompra, DIAS_PARA_INATIVAR);
      c.dataAlteracao = dataInativacao > HOJE ? HOJE : dataInativacao;
    } else {
      c.situacao = 'Ativo';
      c.dataAlteracao = addDays(HOJE, -ultimoOffset);
    }
  });
}

function gerarPedidos(){
  const pedidos = [];
  let seq = 58000;
  for(let offset=134; offset>=0; offset--){
    const data = addDays(HOJE, -offset);
    const dow = data.getDay();
    if(dow===0) continue;
    let base = dow===6 ? ri(0,5) : ri(11,27);
    const trend = 1 + (134-offset)/134*0.16;
    const wave = 1 + 0.06*Math.sin(offset/9);
    const count = Math.round(base*trend*wave);
    const poolDia = CLIENTES_COMPRADORES.filter(c=> offset>=c.cutoffOffset);

    for(let k=0;k<count;k++){
      const cliente = pick(poolDia.length?poolDia:CLIENTES_COMPRADORES);
      const vendedor = rand()<0.72 ? cliente.vendedor : pick(VENDEDORES);
      let situacao;
      if(offset>20){
        situacao = weightedPick([['FATURADO',.91],['CANCELADO',.09]], x=>x[1])[0];
      } else if(offset>7){
        situacao = weightedPick(
          [['FATURADO',.82],['CANCELADO',.08],['LIBERADO',.05],['EMITIDO',.05]],
          x=>x[1]
        )[0];
      } else {
        situacao = weightedPick(
          [['EMITIDO',.34],['LIBERADO',.29],['FATURADO',.30],['CANCELADO',.07]],
          x=>x[1]
        )[0];
      }

      let acomp = '-';
      if(situacao==='EMITIDO') acomp = 'PENDENTE';
      else if(situacao==='LIBERADO'){
        acomp = weightedPick([['DISPONIVEL',.35],['EM SEPARACAO',.3],['SEPARADO',.25],['EM TRANSITO',.1]], x=>x[1])[0];
      } else if(situacao==='FATURADO'){
        if(offset>15) acomp = 'FINALIZADO';
        else if(offset>6) acomp = rand()<0.88 ? 'FINALIZADO' : 'EM TRANSITO';
        else acomp = weightedPick([['SEPARADO',.18],['EM TRANSITO',.32],['FINALIZADO',.5]], x=>x[1])[0];
      }

      const expFactor = rand()<0.1 ? rf(3,6) : 1;
      const valorTotal = Math.round((rf(900,7800))*expFactor);
      const qtd = Math.max(4, Math.round(valorTotal/rf(65,110)));
      const volume = +(qtd*rf(0.003,0.006)).toFixed(2);
      const prazo = pick(PRAZOS);
      const dataLimite = addDays(data, prazo);
      const atrasoDias = Math.max(0, dayOffset(dataLimite))*-1 + 0; // placeholder, recalculated below
      const emAndamento = (situacao==='LIBERADO' || situacao==='FATURADO') && acomp!=='FINALIZADO';
      const diasParaLimite = Math.round((dataLimite-HOJE)/86400000);
      const atrasada = emAndamento && diasParaLimite < 0;
      const itemVendido = weightedPick(PRODUTOS, x=>x.peso);

      seq++;
      pedidos.push({
        numero: 'PED-'+seq,
        dataEmissao: data,
        offset,
        dataFat: data,
        offsetFat: offset,
        tempoEntrega: prazo,
        condPgto: pick(CONDICOES_PGTO),
        valorTotal, qtd, volume,
        cliente, vendedor,
        naturezaCliente: cliente.tipoVenda,
        transportadora: pick(TRANSPORTADORAS),
        cfop: pick(CFOPS),
        situacao,
        situacaoAcomp: acomp,
        temCotacao: situacao==='EMITIDO',
        motivoPendencia: situacao==='EMITIDO' ? weightedPick(MOTIVOS_PENDENCIA, m=>m.peso).motivo : null,
        prazoEntrega: prazo,
        dataLimite,
        emAndamento,
        atrasada,
        diasParaLimite,
        amostra: rand()<0.06,
        motorista: emAndamento && acomp!=='PENDENTE' && acomp!=='DISPONIVEL' ? pick(MOTORISTAS) : null,
        responsavel: pick(USUARIOS_RESPONSAVEIS),
        produto: itemVendido.nome,
        divisao: itemVendido.divisao,
      });
    }
  }
  return pedidos;
}

  const norm = v/mag;

  return step*mag;
}

function lineAreaChart(mount, opts){
  const {data, meta, formatY, formatX, width=640, height=210, color='var(--s1)'} = opts;
  const pad = {top:14, right:10, bottom:24, left:44};
  const w = width, h = height;
  const plotW = w-pad.left-pad.right, plotH = h-pad.top-pad.bottom;
  const maxVal = niceMax(Math.max(meta||0, ...data.map(d=>d.y))*1.08);
  const x = i => pad.left + (data.length<=1?0:(i/(data.length-1))*plotW);
  const y = v => pad.top + plotH - (v/maxVal)*plotH;

  const wrap = document.createElement('div');
  wrap.className = 'chart-wrap';
  const svg = el('svg',{class:'chart', viewBox:`0 0 ${w} ${h}`, role:'img'});

  const ticks = 4;
  for(let t=0;t<=ticks;t++){
    const val = maxVal*t/ticks;
    const yy = y(val);
    svg.appendChild(el('line',{x1:pad.left, x2:w-pad.right, y1:yy, y2:yy, stroke:'var(--grid)', 'stroke-width':1}));
    const lbl = el('text',{x:pad.left-8, y:yy+3, 'text-anchor':'end', 'font-size':10, fill:'var(--ink-muted)'});
    lbl.textContent = compactBRL(val).replace('R$ ','');
    svg.appendChild(lbl);
  }

  const step = Math.ceil(data.length/7);
  data.forEach((d,i)=>{
    if(i%step!==0 && i!==data.length-1) return;
    const lbl = el('text',{x:x(i), y:h-6, 'text-anchor':'middle', 'font-size':10, fill:'var(--ink-muted)'});
    lbl.textContent = formatX(d.x,i);
    svg.appendChild(lbl);
  });

  if(meta){
    const my = y(meta);
    svg.appendChild(el('line',{x1:pad.left, x2:w-pad.right, y1:my, y2:my, stroke:'var(--ink-muted)', 'stroke-width':1, 'stroke-dasharray':'3 4'}));
    const lbl = el('text',{x:w-pad.right, y:my-5, 'text-anchor':'end', 'font-size':9.5, fill:'var(--ink-muted)'});
    lbl.textContent = 'meta '+compactBRL(meta).replace('R$ ','');
    svg.appendChild(lbl);
  }

  let dPath = '', aPath = '';
  data.forEach((d,i)=>{
    const cmd = i===0?'M':'L';
    dPath += `${cmd}${x(i).toFixed(1)},${y(d.y).toFixed(1)} `;
  });
  aPath = `M${x(0).toFixed(1)},${y(0).toFixed(1)} ` + dPath.slice(1) + `L${x(data.length-1).toFixed(1)},${y(0).toFixed(1)} Z`;

  const gradId = 'grad-'+Math.random().toString(36).slice(2,9);
  const defs = el('defs',{},[
    (()=>{ const g = el('linearGradient',{id:gradId, x1:0,y1:0,x2:0,y2:1});
      g.appendChild(el('stop',{offset:'0%','stop-color':color,'stop-opacity':0.28}));
      g.appendChild(el('stop',{offset:'100%','stop-color':color,'stop-opacity':0.02}));
      return g; })()
  ]);
  svg.appendChild(defs);
  svg.appendChild(el('path',{d:aPath, fill:`url(#${gradId})`, stroke:'none'}));
  svg.appendChild(el('path',{d:dPath.trim(), fill:'none', stroke:color, 'stroke-width':2, 'stroke-linecap':'round', 'stroke-linejoin':'round'}));

  const lastI = data.length-1;
  svg.appendChild(el('circle',{cx:x(lastI), cy:y(data[lastI].y), r:4, fill:color, stroke:'var(--surface-1)', 'stroke-width':2}));

  const crossLine = el('line',{x1:0,x2:0,y1:pad.top,y2:pad.top+plotH, stroke:'var(--ink-muted)', 'stroke-width':1, opacity:0});
  const crossDot = el('circle',{r:4.5, fill:color, stroke:'var(--surface-1)', 'stroke-width':2, opacity:0});
  svg.appendChild(crossLine); svg.appendChild(crossDot);
  const hitRect = el('rect',{x:pad.left, y:0, width:plotW, height:h, fill:'transparent'});
  svg.appendChild(hitRect);

  wrap.appendChild(svg);
  const tip = document.createElement('div');
  tip.className='chart-tooltip'; tip.style.display='none';
  wrap.appendChild(tip);

  hitRect.addEventListener('mousemove', (e)=>{
    const rect = svg.getBoundingClientRect();
    const scale = w/rect.width;
    const mx = (e.clientX-rect.left)*scale;
    let idx = Math.round(((mx-pad.left)/plotW)*(data.length-1));
    idx = clamp(idx,0,data.length-1);
    const d = data[idx];
    crossLine.setAttribute('x1',x(idx)); crossLine.setAttribute('x2',x(idx)); crossLine.setAttribute('opacity',0.5);
    crossDot.setAttribute('cx',x(idx)); crossDot.setAttribute('cy',y(d.y)); crossDot.setAttribute('opacity',1);
    const px = (x(idx)/w)*rect.width;
    const py = (y(d.y)/h)*rect.height;
    tip.style.display='block';
    tip.style.left = px+'px'; tip.style.top = py+'px';
    tip.innerHTML = `<b>${formatX(d.x,idx,true)}</b><br>${formatY(d.y)}`;
  });
  hitRect.addEventListener('mouseleave', ()=>{
    crossLine.setAttribute('opacity',0); crossDot.setAttribute('opacity',0); tip.style.display='none';
  });

  mount.appendChild(wrap);
}

function hBarChart(mount, opts){

  items.forEach((it,i)=>{

    const lbl = el('text',{x:labelW-10, y:cy+4, 'text-anchor':'end', 'font-size':11.5, fill:'var(--ink-secondary)'});

function vBarChart(mount, opts){

  const plotW = width-pad.left-pad.right, plotH = height-pad.top-pad.bottom;
  const maxVal = niceMax(Math.max(...items.map(i=>i.value))*1.15);
  const n = items.length;
  const slot = plotW/n;
  const barW = Math.min(22, slot*0.55);

  const wrap = document.createElement('div'); wrap.className='chart-wrap';
  const svg = el('svg',{class:'chart', viewBox:`0 0 ${width} ${height}`});

  for(let t=0;t<=3;t++){
    const val = maxVal*t/3;
    const yy = pad.top+plotH-(val/maxVal)*plotH;
    svg.appendChild(el('line',{x1:pad.left,x2:width-pad.right,y1:yy,y2:yy,stroke:'var(--grid)','stroke-width':1}));
    const lbl = el('text',{x:pad.left-6,y:yy+3,'text-anchor':'end','font-size':9.5,fill:'var(--ink-muted)'});
    lbl.textContent = fmtNum(val);
    svg.appendChild(lbl);
  }

  const tip = document.createElement('div'); tip.className='chart-tooltip'; tip.style.display='none';

  items.forEach((it,i)=>{
    const cx = pad.left + slot*i + slot/2;
    const barH = (it.value/maxVal)*plotH;
    const yy = pad.top+plotH-barH;
    const color = colorFn ? colorFn(it,i) : 'var(--s1)';
    const bar = el('rect',{x:cx-barW/2, y:yy, width:barW, height:Math.max(1,barH), rx:4, fill:color});
    svg.appendChild(bar);

    const showLbl = n<=10 || i%Math.ceil(n/10)===0 || i===n-1;
    if(showLbl){
      const lbl = el('text',{x:cx,y:height-8,'text-anchor':'middle','font-size':9.5,fill:'var(--ink-muted)'});
      lbl.textContent = it.label;
      svg.appendChild(lbl);
    }

    const hit = el('rect',{x:pad.left+slot*i,y:0,width:slot,height:height,fill:'transparent'});
    svg.appendChild(hit);
    hit.addEventListener('mousemove',(e)=>{
      bar.setAttribute('opacity',0.8);
      const rect = svg.getBoundingClientRect();
      const px = (cx/width)*rect.width, py=(yy/height)*rect.height;
      tip.style.display='block'; tip.style.left=px+'px'; tip.style.top=py+'px';
      tip.innerHTML = `<b>${it.label}</b><br>${formatValue(it.value)}`;
    });
    hit.addEventListener('mouseleave',()=>{ bar.setAttribute('opacity',1); tip.style.display='none'; });
  });

  wrap.appendChild(svg); wrap.appendChild(tip);
  mount.appendChild(wrap);
}

function groupedBarChart(mount, opts){
  const {items, series, formatValue, width=640, height=200} = opts;
  const pad = {top:10, right:10, bottom:26, left:40};
  const plotW = width-pad.left-pad.right, plotH = height-pad.top-pad.bottom;
  const maxVal = niceMax(Math.max(...items.flatMap(it=>series.map(s=>it[s.key])))*1.15);
  const n = items.length;
  const slot = plotW/n;
  const groupW = Math.min(26, slot*0.72);
  const barW = groupW/series.length;

  const wrap = document.createElement('div'); wrap.className='chart-wrap';
  const svg = el('svg',{class:'chart', viewBox:`0 0 ${width} ${height}`});

  for(let t=0;t<=3;t++){
    const val = maxVal*t/3;
    const yy = pad.top+plotH-(val/maxVal)*plotH;
    svg.appendChild(el('line',{x1:pad.left,x2:width-pad.right,y1:yy,y2:yy,stroke:'var(--grid)','stroke-width':1}));
    const lbl = el('text',{x:pad.left-6,y:yy+3,'text-anchor':'end','font-size':9.5,fill:'var(--ink-muted)'});
    lbl.textContent = fmtNum(val);
    svg.appendChild(lbl);
  }

  const tip = document.createElement('div'); tip.className='chart-tooltip'; tip.style.display='none';

  items.forEach((it,i)=>{
    const gx = pad.left + slot*i + slot/2 - groupW/2;
    series.forEach((s,si)=>{
      const val = it[s.key];
      const barH = (val/maxVal)*plotH;
      const x = gx + si*barW;
      const yy = pad.top+plotH-barH;
      svg.appendChild(el('rect',{x, y:yy, width:Math.max(1,barW-2), height:Math.max(1,barH), rx:3, fill:s.color}));
    });

    const showLbl = n<=10 || i%Math.ceil(n/10)===0 || i===n-1;
    if(showLbl){
      const lbl = el('text',{x:pad.left+slot*i+slot/2,y:height-8,'text-anchor':'middle','font-size':9.5,fill:'var(--ink-muted)'});
      lbl.textContent = it.label;
      svg.appendChild(lbl);
    }

    const hit = el('rect',{x:pad.left+slot*i,y:0,width:slot,height:height,fill:'transparent'});
    svg.appendChild(hit);
    hit.addEventListener('mousemove',()=>{
      const rect = svg.getBoundingClientRect();
      const px = ((pad.left+slot*i+slot/2)/width)*rect.width, py = ((pad.top+plotH*0.15)/height)*rect.height;
      tip.style.display='block'; tip.style.left=px+'px'; tip.style.top=py+'px';
      tip.innerHTML = `<b>${it.label}</b><br>`+series.map(s=>`${s.label}: ${formatValue(it[s.key])}`).join('<br>');
    });
    hit.addEventListener('mouseleave',()=>{ tip.style.display='none'; });
  });

  wrap.appendChild(svg); wrap.appendChild(tip);
  mount.appendChild(wrap);

  const legend = document.createElement('div'); legend.className='legend-row'; legend.style.cssText='padding:10px 0 0;';
  series.forEach(s=>{
    const chip = document.createElement('div'); chip.className='legend-chip';
    chip.innerHTML = `<span class="legend-swatch" style="background:${s.color}"></span>${s.label}`;
    legend.appendChild(chip);
  });
  mount.appendChild(legend);
}

function pieChart(mount, segments){
  const total = segments.reduce((s,x)=>s+x.value,0) || 1;
  const size = 210, cx=size/2, cy=size/2, r=size/2-6;

  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:flex; align-items:center; gap:26px; flex-wrap:wrap;';
  const svgWrap = document.createElement('div'); svgWrap.style.cssText='position:relative; flex:0 0 auto;';
  const svg = el('svg',{class:'chart', viewBox:`0 0 ${size} ${size}`, style:`width:${size}px; max-width:100%;`});
  const tip = document.createElement('div'); tip.className='chart-tooltip'; tip.style.display='none';

  let angle = -Math.PI/2;
  segments.forEach(seg=>{
    if(seg.value<=0) return;
    const frac = seg.value/total;
    const nextAngle = angle + frac*Math.PI*2;
    const x1 = cx + r*Math.cos(angle), y1 = cy + r*Math.sin(angle);
    const x2 = cx + r*Math.cos(nextAngle), y2 = cy + r*Math.sin(nextAngle);
    const largeArc = frac>0.5 ? 1 : 0;
    const d = `M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${largeArc} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z`;
    const path = el('path',{d, fill:seg.color, stroke:'var(--surface-1)', 'stroke-width':2});
    svg.appendChild(path);
    path.addEventListener('mousemove',()=>{
      path.setAttribute('opacity',0.82);
      const rect = svg.getBoundingClientRect();
      tip.style.display='block'; tip.style.left=(rect.width/2)+'px'; tip.style.top=(rect.height/2)+'px';
      tip.innerHTML = `<b>${seg.label}</b><br>${fmtNum(seg.value)} (${pct(frac,1)})`;
    });
    path.addEventListener('mouseleave',()=>{ path.setAttribute('opacity',1); tip.style.display='none'; });
    angle = nextAngle;
  });
  svgWrap.appendChild(svg); svgWrap.appendChild(tip);
  wrap.appendChild(svgWrap);

  const legend = document.createElement('div'); legend.style.cssText='display:flex; flex-direction:column; gap:9px;';
  segments.forEach(seg=>{
    const row = document.createElement('div'); row.style.cssText='display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-secondary);';
    row.innerHTML = `<span style="width:10px;height:10px;border-radius:3px;background:${seg.color};flex:0 0 auto;"></span>${seg.label} · <b class="num" style="color:var(--ink-primary)">${fmtNum(seg.value)}</b> (${pct(seg.value/total,1)})`;
    legend.appendChild(row);
  });
  wrap.appendChild(legend);
  mount.appendChild(wrap);
}

function sparkline(mount, values, color){
  const w=100,h=28;
  const max = Math.max(...values,1), min = Math.min(...values,0);
  const range = (max-min)||1;
  const x = i=> (i/(values.length-1))*w;
  const y = v=> h-((v-min)/range)*h;
  let d=''; values.forEach((v,i)=> d += (i===0?'M':'L')+x(i).toFixed(1)+','+y(v).toFixed(1)+' ');
  const svg = el('svg',{class:'spark', viewBox:`0 0 ${w} ${h}`, width:'100', height:'28'});
  svg.appendChild(el('path',{d:d.trim(), fill:'none', stroke:color, 'stroke-width':1.8, 'stroke-linecap':'round','stroke-linejoin':'round'}));
  svg.appendChild(el('circle',{cx:x(values.length-1), cy:y(values[values.length-1]), r:2.4, fill:color}));
  mount.appendChild(svg);
}

const SEQ_RAMP = ['#cde2fb','#b7d3f6','#9ec5f4','#86b6ef','#6da7ec','#5598e7','#3987e5','#2a78d6','#256abf','#1c5cab','#184f95','#104281','#0d366b'];
function seqColor(t){
  const idx = clamp(Math.round(t*(SEQ_RAMP.length-1)),0,SEQ_RAMP.length-1);
  return SEQ_RAMP[idx];
}
function textColorFor(hex){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  const lum = (0.299*r+0.587*g+0.114*b)/255;
  return lum>0.58 ? '#111111' : '#ffffff';
}

function brazilHeatmap(mount, opts){
  const {valueByUF, formatValue} = opts;
  const entries = Object.entries(BR_MAP.states);
  const vals = entries.map(([uf])=> valueByUF[uf]||0).filter(v=>v>0);
  const maxVal = vals.length? Math.max(...vals) : 1;
  const vw = BR_MAP.viewBox[2], vh = BR_MAP.viewBox[3];

  const wrap = document.createElement('div'); wrap.className='chart-wrap';
  const svg = el('svg',{class:'chart', viewBox:`0 0 ${vw} ${vh}`, style:'max-height:420px; margin:0 auto; display:block;'});
  const tip = document.createElement('div'); tip.className='chart-tooltip'; tip.style.display='none';

  entries.forEach(([uf, st])=>{
    const val = valueByUF[uf]||0;
    const t = val>0 ? val/maxVal : 0;
    const fill = val>0 ? seqColor(t) : 'var(--surface-2)';
    const path = el('path',{d:st.d, fill, stroke:'var(--surface-1)', 'stroke-width':1.1, 'stroke-linejoin':'round'});
    svg.appendChild(path);
    path.addEventListener('mousemove',(e)=>{
      path.setAttribute('stroke','var(--ink-primary)'); path.setAttribute('stroke-width',1.8);
      const rect = svg.getBoundingClientRect();
      const px = (st.cx/vw)*rect.width, py=(st.cy/vh)*rect.height;
      tip.style.display='block'; tip.style.left=px+'px'; tip.style.top=py+'px';
      tip.innerHTML = `<b>${st.nome} (${uf})</b><br>${val>0? formatValue(val) : 'sem registros no período'}`;
    });
    path.addEventListener('mouseleave',()=>{
      path.setAttribute('stroke','var(--surface-1)'); path.setAttribute('stroke-width',1.1);
      tip.style.display='none';
    });
  });

  const LABELED = ['AM','PA','MT','BA','MG','SP','RS','GO','MS','PR','TO','MA','PI'];
  entries.forEach(([uf,st])=>{
    if(!LABELED.includes(uf)) return;
    const val = valueByUF[uf]||0;
    const fill = val>0? seqColor(val/maxVal) : 'var(--surface-2)';
    const t = el('text',{x:st.cx, y:st.cy+3.5, 'text-anchor':'middle', 'font-size':10.5, 'font-weight':700, fill:textColorFor(fill), 'pointer-events':'none'});
    t.textContent = uf;
    svg.appendChild(t);
  });

  wrap.appendChild(svg); wrap.appendChild(tip);
  mount.appendChild(wrap);

  const legend = document.createElement('div');
  legend.style.cssText = 'display:flex; align-items:center; justify-content:center; gap:8px; margin-top:12px; font-size:11px; color:var(--ink-muted);';
  const gradId = 'seqgrad-'+Math.random().toString(36).slice(2,8);
  const legendSvg = el('svg',{width:130,height:12,viewBox:'0 0 130 12'});
  const lgDefs = el('defs',{},[(()=>{
    const g = el('linearGradient',{id:gradId, x1:0,y1:0,x2:1,y2:0});
    SEQ_RAMP.forEach((c,i)=> g.appendChild(el('stop',{offset:(i/(SEQ_RAMP.length-1)*100)+'%','stop-color':c})));
    return g;
  })()]);
  legendSvg.appendChild(lgDefs);
  legendSvg.appendChild(el('rect',{x:0,y:0,width:130,height:12,rx:4,fill:`url(#${gradId})`}));
  const lo = document.createElement('span'); lo.textContent='menor';
  const hi = document.createElement('span'); hi.textContent='maior';
  const noData = document.createElement('span');
  noData.style.cssText='display:inline-flex;align-items:center;gap:5px;margin-left:16px;';
  noData.innerHTML = `<span style="width:10px;height:10px;border-radius:3px;background:var(--surface-2);border:1px solid var(--border);display:inline-block;"></span>sem dados`;
  legend.appendChild(lo); legend.appendChild(legendSvg); legend.appendChild(hi); legend.appendChild(noData);
  mount.appendChild(legend);
}

    btn.className='card-toggle'; btn.textContent='Ver tabela';
    head.appendChild(btn);
    const body = document.createElement('div'); body.className='card-body';
    const chartHolder = document.createElement('div');
    renderChart(chartHolder);
    body.appendChild(chartHolder);

    const tableHolder = document.createElement('div');
    tableHolder.style.display='none';
    tableHolder.appendChild(buildTable(tableColumns, tableRows));
    body.appendChild(tableHolder);

    btn.addEventListener('click', ()=>{
      showingTable = !showingTable;
      chartHolder.style.display = showingTable? 'none':'block';
      tableHolder.style.display = showingTable? 'block':'none';
      btn.textContent = showingTable? 'Ver gráfico':'Ver tabela';
    });
    card.appendChild(head); card.appendChild(body);
  } else {
    const body = document.createElement('div'); body.className='card-body';
    renderChart(body);
    card.appendChild(head); card.appendChild(body);
  }
  return card;
}

function buildTable(columns, rows){
  const table = document.createElement('table'); table.className='data-table';
  const thead = document.createElement('thead');
  thead.innerHTML = '<tr>'+columns.map(c=>`<th>${c.label}</th>`).join('')+'</tr>';
  table.appendChild(thead);
  const tbody = document.createElement('tbody');
  rows.forEach(r=>{
    const tr = document.createElement('tr');
    tr.innerHTML = columns.map(c=>`<td class="${c.strong?'strong':''} ${c.mono?'mono':''}">${c.render? c.render(r) : r[c.key]}</td>`).join('');
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  return table;
}

function tableCard({title, subtitle, columns, rows, note}){
  const card = document.createElement('div'); card.className='card';
  const head = document.createElement('div'); head.className='card-head';
  head.innerHTML = `<div><div class="card-title">${title}</div>${subtitle?`<div class="card-subtitle">${subtitle}</div>`:''}</div>`;
  card.appendChild(head);
  const body = document.createElement('div'); body.className='card-body';
  body.appendChild(buildTable(columns, rows));
  card.appendChild(body);
  if(note){ const n = document.createElement('div'); n.className='table-note'; n.textContent=note; n.style.padding='10px 18px 16px'; card.appendChild(n); }
  return card;
}

/* ---------------------------------------------------------------- state + filtering */
let currentPeriod = 30;
let currentPane = 'faturamento';
// Filtro de data fixo: do último dia do mês passado (fechamento) até hoje.
function ultimoDiaMesAnterior(d){ return new Date(d.getFullYear(), d.getMonth(), 0); }
function mesmoDiaMesAnterior(d){
  const t = new Date(d.getFullYear(), d.getMonth()-1, 1);
  t.setDate(Math.min(d.getDate(), daysInMonth(t)));
  return t;
}
function inicioJanela(){ return ultimoDiaMesAnterior(HOJE); }
function diasJanela(){ return dayOffset(inicioJanela())+1; }
function rotuloJanela(){ return fmtDateShort(inicioJanela())+' → '+fmtDateShort(HOJE); }

function monthSelector(root){
  const ini = inicioJanela();
  const chip = document.createElement('div');
  chip.className = 'live-chip';
  chip.innerHTML = `<span class="live-dot" style="background:var(--good)"></span><span>Período fixo: último fechamento (${fmtDateShort(ini)}) até hoje (${fmtDateShort(HOJE)})</span>`;
  root.appendChild(chip);
  return {refMonthStart: ini, refEnd: HOJE, totalDiasMes: daysInMonth(HOJE), diasDecorridos: diasJanela()};
}


function avisoIndisponivel(mount, texto){
  const d = document.createElement('div');
  d.style.cssText = 'padding:26px 4px; color:var(--ink-muted); font-size:12.5px; line-height:1.6;';
  d.textContent = texto;
  mount.appendChild(d);
}
const MSG_PRODUTO = 'Indisponível nas views atuais: VW_PEDIDOS não expõe o código do produto do item (COD_PRD_ITE_PED_029) e VW_PRODUTOS não expõe COD_PRD_009. Com essas duas colunas o gráfico é ligado.';
const MSG_MOTIVO = 'Indisponível nas views atuais: nenhuma das 3 views traz o motivo da pendência da cotação.';

/* ---------------------------------------------------------------- pane: faturamento */
function renderFaturamento(root){
  const {refMonthStart, refEnd, totalDiasMes, diasDecorridos} = monthSelector(root);

  const prevMonthStart = ultimoDiaMesAnterior(refMonthStart);
  const prevEnd = mesmoDiaMesAnterior(HOJE);

  const ped = PEDIDOS.filter(p=>p.situacao==='FATURADO' && p.dataFat>=refMonthStart && p.dataFat<=refEnd);
  const pedAnt = PEDIDOS.filter(p=>p.situacao==='FATURADO' && p.dataFat>=prevMonthStart && p.dataFat<=prevEnd);
  const totalAtual = ped.reduce((s,p)=>s+p.valorTotal,0);
  const totalAnterior = pedAnt.reduce((s,p)=>s+p.valorTotal,0);
  const temComparativo = totalAnterior>0;
  const variacao = temComparativo ? (totalAtual-totalAnterior)/totalAnterior : 0;

  const metaMensal = META_MENSAL_EMPRESA;
  const temMeta = metaMensal!=null;
  const metaProrata = temMeta ? metaMensal * (diasDecorridos/totalDiasMes) : 0;
  const atingMeta = temMeta ? totalAtual / metaProrata : 0;

  const kpis = document.createElement('div'); kpis.className='kpi-row';

  const hojePed = PEDIDOS.filter(p=>p.offsetFat===0 && p.situacao==='FATURADO');
  const faturamentoHoje = hojePed.reduce((s,p)=>s+p.valorTotal,0);
  const last14 = [];
  for(let o=13;o>=0;o--){ last14.push(PEDIDOS.filter(p=>p.offsetFat===o && p.situacao==='FATURADO').reduce((s,p)=>s+p.valorTotal,0)); }
  kpis.appendChild(statTile({label:'Faturamento hoje', value:fmtBRL(faturamentoHoje), sub: hojePed.length+' pedidos faturados', sparkValues:last14, sparkColor:'var(--s1)'}));

  kpis.appendChild(statTile({label:'Faturamento no período', value:fmtBRL(totalAtual),
    deltaText: temComparativo? (variacao>=0?'↑ ':'↓ ')+pct(Math.abs(variacao),1) : 'sem comparativo',
    tone: temComparativo? (variacao>=0?'good':'critical') : 'neutral',
    sub: temComparativo? 'vs. mesmo período do mês anterior: '+fmtBRL(totalAnterior) : 'mês anterior sem dados na amostra'}));

  if(temMeta){
    kpis.appendChild(statTile({label:'Faturamento vs Meta', value:fmtBRL(totalAtual),
      deltaText: pct(atingMeta,1), tone: atingMeta>=1?'good':(atingMeta>=0.85?'neutral':'critical'),
      sub: 'Meta do mês: '+fmtBRL(metaMensal)+' · pro-rata: '+fmtBRL(metaProrata)}));
  } else {
    kpis.appendChild(statTile({label:'Faturamento vs Meta', value:fmtBRL(totalAtual),
      sub:'Meta não configurada · defina META_MENSAL_EMPRESA no .env'}));
  }

  kpis.appendChild(statTile({label:'Pedidos faturados', value:fmtNum(ped.length), sub: rotuloJanela()+' · '+fmtNum(diasDecorridos)+' dias'}));

  root.appendChild(kpis);

  const grid = document.createElement('div'); grid.className='grid-2';

  const serieDiaria = [];
  for(let o=diasDecorridos-1; o>=0; o--){
    const day = addDays(HOJE,-o);
    const val = ped.filter(p=>p.offsetFat===o).reduce((s,p)=>s+p.valorTotal,0);
    serieDiaria.push({x:day, y:val});
  }
  const metaDiaria = temMeta ? metaMensal/totalDiasMes : null;
  grid.appendChild(chartCard({
    title:'Faturamento diário', subtitle:`${rotuloJanela()}${temMeta ? ' · linha tracejada = meta/dia' : ' · por data da NF'}`,
    renderChart:(mount)=> lineAreaChart(mount,{
      data:serieDiaria, meta:metaDiaria,
      formatY:v=>fmtBRL(v), formatX:(d,i,full)=> full? fmtDateFull(d) : fmtDateShort(d),
      color:'var(--s1)'
    }),
    tableColumns:[{key:'data',label:'Data'},{key:'valor',label:'Faturamento', strong:true}],
    tableRows: serieDiaria.map(d=>({data:fmtDateFull(d.x), valor:fmtBRL(d.y)}))
  }));

  const porRegiao = {};
  ped.forEach(p=>{ porRegiao[p.cliente.regiao]=(porRegiao[p.cliente.regiao]||0)+p.valorTotal; });
  const regItems = Object.entries(porRegiao).sort((a,b)=>b[1]-a[1]).map(([label,value])=>({label,value}));
  grid.appendChild(chartCard({
    title:'Faturamento por região', subtitle:'Distribuição geográfica do período',
    renderChart:(mount)=> hBarChart(mount,{items:regItems, formatValue:fmtBRL, width:480,
      colorFn:(it,i)=>['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)'][i%5]})
  }));
  root.appendChild(grid);

  const grid2 = document.createElement('div'); grid2.className='grid-2';

  const porDivisao = {};
  ped.forEach(p=>{ porDivisao[p.divisao]=(porDivisao[p.divisao]||0)+p.valorTotal; });
  const divItems = Object.entries(porDivisao).sort((a,b)=>b[1]-a[1]).map(([label,value])=>({label,value}));
  grid2.appendChild(chartCard({
    title:'Faturamento por divisão de produto', subtitle:'Origem VW_PRODUTOS · agregado por pedido',
    renderChart:(mount)=>{
      if(!LIMITES.produtos){ avisoIndisponivel(mount, MSG_PRODUTO); return; }
      hBarChart(mount,{items:divItems, formatValue:fmtBRL, width:480,
        colorFn:(it,i)=>['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)','var(--s6)','var(--s7)','var(--s8)'][i%8]});
    }
  }));

  const porProduto = {};
  ped.forEach(p=>{ porProduto[p.produto]=(porProduto[p.produto]||0)+p.valorTotal; });
  const prodItems = Object.entries(porProduto).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([label,value])=>({label,value}));
  grid2.appendChild(chartCard({
    title:'Faturamento por produto', subtitle:'Top 10 produtos do período · origem VW_PRODUTOS',
    renderChart:(mount)=>{
      if(!LIMITES.produtos){ avisoIndisponivel(mount, MSG_PRODUTO); return; }
      if(!prodItems.length){
        const p = document.createElement('div'); p.style.cssText='padding:30px 0;text-align:center;color:var(--ink-muted);font-size:12.5px;';
        p.textContent = 'Nenhum faturamento no período.'; mount.appendChild(p); return;
      }
      hBarChart(mount,{items:prodItems, formatValue:fmtBRL, width:480, colorFn:()=>'var(--s1)'});
    }
  }));
  root.appendChild(grid2);

  const porCliente = {};
  ped.forEach(p=>{ const k=p.cliente.razaoSocial; porCliente[k]=(porCliente[k]||0)+p.valorTotal; });
  const topClientes = Object.entries(porCliente).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([label,value])=>({label,value}));
  root.appendChild(chartCard({
    title:'Top clientes', subtitle:'Maiores faturamentos do período',
    renderChart:(mount)=> hBarChart(mount,{items:topClientes, formatValue:fmtBRL, width:480, colorFn:()=> 'var(--s1)'})
  }));
}

/* ---------------------------------------------------------------- pane: pedidos */
function renderPedidos(root){
  const {refMonthStart, refEnd, diasDecorridos} = monthSelector(root);

  const ped = PEDIDOS.filter(p=>p.dataEmissao>=refMonthStart && p.dataEmissao<=refEnd);
  const totalCotacoes = ped.length; // todo pedido nasce como cotação
  const faturados = ped.filter(p=>p.situacao==='FATURADO').length;
  const confirmados = ped.filter(p=>p.situacao==='LIBERADO'||p.situacao==='FATURADO').length;

  const kpis = document.createElement('div'); kpis.className='kpi-row';

  const hojeFaturados = PEDIDOS.filter(p=>p.offsetFat===0 && p.situacao==='FATURADO');
  const valorHoje = hojeFaturados.reduce((s,p)=>s+p.valorTotal,0);
  kpis.appendChild(statTile({label:'Pedidos do dia', value:fmtNum(hojeFaturados.length), sub:'faturados hoje · '+fmtBRL(valorHoje)}));

  kpis.appendChild(statTile({label:'Pedidos no período', value:fmtNum(totalCotacoes), sub: rotuloJanela()+' · '+diasDecorridos+' dias'}));
  kpis.appendChild(statTile({label:'Faturados', value:fmtNum(faturados), sub:pct(faturados/(totalCotacoes||1),1)+' do total'}));
  kpis.appendChild(statTile({label:'Cotações vs Emitidos', value:fmtNum(totalCotacoes),
    deltaText: pct(confirmados/(totalCotacoes||1),0)+' confirmados', tone: confirmados/(totalCotacoes||1)>=0.7?'good':'neutral',
    sub: 'Todo pedido nasce como cotação · '+fmtNum(confirmados)+' confirmados de '+fmtNum(totalCotacoes)}));
  root.appendChild(kpis);

  const dailyItems = [];
  for(let o=diasDecorridos-1; o>=0; o--){
    const day = addDays(HOJE,-o);
    const doDia = ped.filter(p=>p.offset===o);
    const confirmadosDia = doDia.filter(p=>p.situacao==='LIBERADO'||p.situacao==='FATURADO').length;
    dailyItems.push({label:fmtDateShort(day), cotacoes:doDia.length, pedidos:confirmadosDia});
  }
  root.appendChild(chartCard({
    title:'Pedidos emitidos por dia', subtitle:`Cotações x pedidos confirmados · ${rotuloJanela()}`,
    renderChart:(mount)=> groupedBarChart(mount,{items:dailyItems, width:1040, height:220, formatValue:v=>fmtNum(v)+' pedidos', series:[
      {key:'cotacoes', label:'Cotações', color:'var(--s1)'},
      {key:'pedidos', label:'Pedidos confirmados', color:'var(--good)'},
    ]})
  }));

  const statusColor = {FATURADO:'var(--good)', LIBERADO:'var(--accent)', EMITIDO:'var(--warning)', CANCELADO:'var(--critical)'};
  const statusOrder = ['FATURADO','LIBERADO','EMITIDO','CANCELADO'];
  const statusCounts = statusOrder.map(s=>({label:s, value:ped.filter(p=>p.situacao===s).length, color:statusColor[s]}));
  root.appendChild(chartCard({
    title:'Pedidos por situação', subtitle:`Composição do funil comercial · ${rotuloJanela()}`,
    renderChart:(mount)=> pieChart(mount, statusCounts)
  }));

  const recentes = ped.slice().sort((a,b)=>a.offset-b.offset).slice(0,14);
  root.appendChild(tableCard({
    title:'Pedidos recentes', subtitle:'Últimos lançamentos do período',
    columns:[
      {key:'numero', label:'Pedido', mono:true, strong:true},
      {key:'data', label:'Emissão'},
      {key:'cliente', label:'Cliente'},
      {key:'vendedor', label:'Vendedor'},
      {key:'valor', label:'Valor', strong:true},
      {key:'situacao', label:'Situação', render:r=>`<span class="pill ${r._tone}">${r.situacao}</span>`},
    ],
    rows: recentes.map(p=>({
      numero:p.numero, data:fmtDateShort(p.dataEmissao), cliente:p.cliente.razaoSocial, vendedor:p.vendedor.nome,
      valor:fmtBRL(p.valorTotal), situacao:p.situacao,
      _tone: p.situacao==='FATURADO'?'good':p.situacao==='CANCELADO'?'critical':p.situacao==='LIBERADO'?'neutral':'warning'
    }))
  }));
}

/* ---------------------------------------------------------------- pane: vendedor */
function renderVendedor(root){
  const {refMonthStart, refEnd} = monthSelector(root);

  const ehInterno = p=> VENDEDORES_INTERNOS.some(v=>v.id===p.vendedor.id);
  const ped = PEDIDOS.filter(p=>p.situacao!=='CANCELADO' && p.dataEmissao>=refMonthStart && p.dataEmissao<=refEnd && ehInterno(p));
  const fatur = PEDIDOS.filter(p=>p.situacao==='FATURADO' && p.dataFat>=refMonthStart && p.dataFat<=refEnd && ehInterno(p));

  const porVend = VENDEDORES_INTERNOS.map(v=>{
    const seus = fatur.filter(p=>p.vendedor.id===v.id);
    const faturamento = seus.reduce((s,p)=>s+p.valorTotal,0);
    const numPedidos = ped.filter(p=>p.vendedor.id===v.id).length;
    return {v, faturamento, numPedidos, ticket: seus.length? faturamento/seus.length:0};
  }).sort((a,b)=>b.faturamento-a.faturamento);

  const destaque = porVend[0];
  const ativos = porVend.filter(x=>x.numPedidos>0).length;
  const mediaFat = porVend.reduce((s,x)=>s+x.faturamento,0)/porVend.length;
  const totalFaturado = porVend.reduce((s,x)=>s+x.faturamento,0);
  const ticketEquipe = fatur.length? totalFaturado/fatur.length : 0;

  const kpis = document.createElement('div'); kpis.className='kpi-row';
  kpis.appendChild(statTile({label:'Vendedor destaque', value:destaque.v.nome, sub:fmtBRL(destaque.faturamento)+' faturados'}));
  kpis.appendChild(statTile({label:'Vendedores ativos', value:ativos+' / '+VENDEDORES_INTERNOS.length, sub:'internos com pedidos no período'}));
  kpis.appendChild(statTile({label:'Média por vendedor', value:fmtBRL(mediaFat), sub:'faturamento médio no período'}));
  kpis.appendChild(statTile({label:'Ticket médio da equipe', value:fmtBRL2(ticketEquipe), sub: fatur.length+' pedidos faturados no período'}));
  root.appendChild(kpis);

  const grid = document.createElement('div'); grid.className='grid-2';
  const rankItems = porVend.map(x=>({label:x.v.nome, value:x.faturamento}));
  grid.appendChild(chartCard({
    title:'Ranking de faturamento', subtitle:`Vendedores internos · ${rotuloJanela()}`,
    renderChart:(mount)=> hBarChart(mount,{items:rankItems, formatValue:fmtBRL, width:480,
      colorFn:(it,i)=> i===0?'var(--s1)':'var(--baseline)'})
  }));

  const pedidosItems = porVend.slice().sort((a,b)=>b.numPedidos-a.numPedidos).map(x=>({label:x.v.nome, value:x.numPedidos}));
  grid.appendChild(chartCard({
    title:'Ranking de pedidos', subtitle:`Volume de pedidos por vendedor · ${rotuloJanela()}`,
    renderChart:(mount)=> hBarChart(mount,{items:pedidosItems, formatValue:v=>fmtNum(v)+' pedidos', width:480,
      colorFn:(it,i)=> i===0?'var(--s1)':'var(--baseline)'})
  }));
  root.appendChild(grid);

  const mapCard = document.createElement('div'); mapCard.className='card';
  const mapHead = document.createElement('div'); mapHead.className='card-head';
  mapHead.innerHTML = `<div><div class="card-title">Mapa de vendas por estado</div><div class="card-subtitle">Faturamento por UF do cliente · vendedores internos · ${rotuloJanela()}</div></div>`;
  const vendSelect = document.createElement('select');
  vendSelect.className = 'card-toggle';
  vendSelect.innerHTML = '<option value="">Todos os vendedores</option>' + VENDEDORES_INTERNOS.map(v=>`<option value="${v.id}">${v.nome}</option>`).join('');
  mapHead.appendChild(vendSelect);
  mapCard.appendChild(mapHead);
  const mapBody = document.createElement('div'); mapBody.className='card-body';
  mapCard.appendChild(mapBody);
  root.appendChild(mapCard);

  function drawVendMap(){
    mapBody.innerHTML = '';
    const filtro = vendSelect.value;
    const fonte = filtro ? fatur.filter(p=>p.vendedor.id===filtro) : fatur;
    const valueByUF = {};
    fonte.forEach(p=>{ valueByUF[p.cliente.estado] = (valueByUF[p.cliente.estado]||0) + p.valorTotal; });
    if(!Object.values(valueByUF).some(v=>v>0)){
      const empty = document.createElement('div');
      empty.style.cssText = 'padding:30px 0; text-align:center; color:var(--ink-muted); font-size:12.5px;';
      empty.textContent = 'Sem faturamento deste vendedor no período.';
      mapBody.appendChild(empty);
      return;
    }
    brazilHeatmap(mapBody, {valueByUF, formatValue:fmtBRL});
  }
  vendSelect.addEventListener('change', drawVendMap);
  drawVendMap();

  root.appendChild(tableCard({
    title:'Desempenho por vendedor', subtitle:`Somente vendedores internos · ${rotuloJanela()}`,
    columns:[
      {key:'nome', label:'Vendedor', strong:true},
      {key:'tipo', label:'Tipo'},
      {key:'pedidos', label:'Pedidos'},
      {key:'faturamento', label:'Faturamento', strong:true},
      {key:'ticket', label:'Ticket médio'},
    ],
    rows: porVend.map(x=>({
      nome:x.v.nome, tipo:x.v.tipo, pedidos:fmtNum(x.numPedidos), faturamento:fmtBRL(x.faturamento),
      ticket:fmtBRL2(x.ticket)
    }))
  }));
}

/* ---------------------------------------------------------------- pane: cotações */
function renderCotacoes(root){
  const dias = currentPeriod;
  const emitidas = PEDIDOS.filter(p=>p.offset<dias); // todo pedido nasce como cotação
  const pendentes = emitidas.filter(p=>p.temCotacao);
  const valorPendente = pendentes.reduce((s,p)=>s+p.valorTotal,0);
  const diasAberto = pendentes.map(p=>p.offset);
  const mediaDias = diasAberto.length? diasAberto.reduce((a,b)=>a+b,0)/diasAberto.length : 0;

  const kpis = document.createElement('div'); kpis.className='kpi-row';
  kpis.appendChild(statTile({label:'Cotações emitidas', value:fmtNum(emitidas.length), sub:'total no período · todo pedido nasce como cotação'}));
  kpis.appendChild(statTile({label:'Cotações pendentes', value:fmtNum(pendentes.length),
    sub:pct(pendentes.length/(emitidas.length||1),0)+' ainda aguardando decisão'}));
  kpis.appendChild(statTile({label:'Valor em cotação pendentes', value:fmtBRL(valorPendente), sub:'potencial de faturamento'}));
  kpis.appendChild(statTile({label:'Tempo médio aberto', value:mediaDias.toFixed(1).replace('.',',')+' dias', sub:'desde a emissão'}));
  root.appendChild(kpis);

  const buckets = [
    {label:'0–3 dias', min:0,max:3, color:'var(--good)'},
    {label:'4–7 dias', min:4,max:7, color:'var(--warning)'},
    {label:'8–15 dias', min:8,max:15, color:'var(--serious)'},
    {label:'> 15 dias', min:16,max:9999, color:'var(--critical)'},
  ];
  const bucketItems = buckets.map(b=>({label:b.label, value:pendentes.filter(p=>p.offset>=b.min && p.offset<=b.max).length, color:b.color}));

  const grid = document.createElement('div'); grid.className='grid-2';
  grid.appendChild(chartCard({
    title:'Cotações por tempo em aberto', subtitle:'Quanto mais antiga, maior o risco de perda',
    renderChart:(mount)=> vBarChart(mount,{items:bucketItems, formatValue:v=>fmtNum(v)+' cotações', width:480,
      colorFn:(it)=>it.color})
  }));

  const porMotivo = {};
  pendentes.forEach(p=>{ porMotivo[p.motivoPendencia]=(porMotivo[p.motivoPendencia]||0)+1; });
  const motivoItems = Object.entries(porMotivo).sort((a,b)=>b[1]-a[1]).map(([label,value])=>({label,value}));
  grid.appendChild(chartCard({
    title:'Motivos da pendência', subtitle:'Por que a cotação ainda não virou pedido',
    renderChart:(mount)=>{
      if(!LIMITES.motivoPendencia){ avisoIndisponivel(mount, MSG_MOTIVO); return; }
      if(!motivoItems.length){
        const p = document.createElement('div'); p.style.cssText='padding:30px 0;text-align:center;color:var(--ink-muted);font-size:12.5px;';
        p.textContent = 'Nenhuma cotação pendente no período selecionado.'; mount.appendChild(p); return;
      }
      hBarChart(mount,{items:motivoItems, formatValue:v=>fmtNum(v)+' cotações', width:480,
        colorFn:(it,i)=>['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)','var(--s6)'][i%6]});
    }
  }));
  root.appendChild(grid);

  const grid2 = document.createElement('div'); grid2.className='grid-2';
  const porVendCot = {};

  const prazoMedio = comTempo.length? comTempo.reduce((s,p)=>s+p.tempoEntrega,0)/comTempo.length : 0;

  const kpis = document.createElement('div'); kpis.className='kpi-row';

/* ---------------------------------------------------------------- pane: clientes */
function statsClientes(){
  const map = {};
  CLIENTES.forEach(c=> map[c.id] = c.statsPre || {ultimoOffset:null, faturamentoTotal:0, numPedidos:0});
  if(DADOS_REAIS) return map;
  PEDIDOS.forEach(p=>{
    const s = map[p.cliente.id];
    if(!s) return;
    if(p.situacao!=='CANCELADO' && (s.ultimoOffset===null || p.offset<s.ultimoOffset)) s.ultimoOffset = p.offset;
    if(p.situacao==='FATURADO'){ s.faturamentoTotal += p.valorTotal; s.numPedidos++; }
  });
  return map;
}

/* ---------------------------------------------------------------- dados reais (API /api/dashboard) */
function aplicarDadosReais(d){
  const toDate = s => { if(!s) return null; const [a,b,c] = s.split('-').map(Number); return new Date(a,b-1,c); };
  DADOS_REAIS = true;
  HOJE = toDate(d.hoje);
  META_MENSAL_EMPRESA = d.metaMensal;
  LIMITES = d.limites;
  REGRAS = d.regras;

  VENDEDORES = d.vendedores.map(v=>({id:v.id, nome:v.nome, tipo:v.tipo}));
  VENDEDORES_INTERNOS = VENDEDORES.filter(v=>v.tipo==='Interno');
  const vendPorNome = new Map(VENDEDORES.map(v=>[v.nome, v]));

  CLIENTES = d.clientes.map(c=>{
    const ultima = toDate(c.ultimaCompra), primeira = toDate(c.primeiraCompra);
    return {
      id:c.id, razaoSocial:c.razaoSocial, tipo:'PJ', situacao:'Ativo',
      segmento:c.segmento, tipoVenda:c.tipoVenda, cidade:'', estado:c.estado, regiao:c.regiao,
      vendedor:{id:c.vendedor, nome:c.vendedor, tipo:'Interno'},
      dataCadastro: toDate(c.dataCadastro) || primeira,
      dataAtivacao: toDate(c.dataAtivacao) || primeira,
      dataAlteracao: ultima, cutoffOffset:0,
      statsPre:{ultimoOffset:dayOffset(ultima), faturamentoTotal:c.faturamentoHistorico, numPedidos:c.numPedidos},
    };
  });
  const clientePorNome = new Map(CLIENTES.map(c=>[c.razaoSocial, c]));
  const semCadastro = new Map();
  const clienteDe = nome=>{
    if(clientePorNome.has(nome)) return clientePorNome.get(nome);
    if(!semCadastro.has(nome)) semCadastro.set(nome, {id:nome, razaoSocial:nome||'Sem cliente', tipo:'PJ', situacao:'Ativo',
      segmento:'Não informado', tipoVenda:'Não informado', cidade:'', estado:'', regiao:'Não informada',
      vendedor:{id:'—', nome:'Sem vendedor', tipo:'Externo'}});
    return semCadastro.get(nome);
  };

  PEDIDOS = d.pedidos.map(r=>{
    const dataEmissao = toDate(r.dataEmissao);
    const dataFat = toDate(r.dataNF) || dataEmissao;
    const emAndamento = (r.situacao==='LIBERADO' || r.situacao==='FATURADO') && r.acomp!=='FINALIZADO';
    const dataLimite = addDays(dataEmissao, REGRAS.diasLimiteEntrega);
    const diasParaLimite = Math.round((dataLimite-HOJE)/86400000);
    const saida = toDate(r.dataSaida);
    return {
      numero:r.numero, dataEmissao, offset:dayOffset(dataEmissao), dataFat, offsetFat:dayOffset(dataFat),
      valorTotal:r.valor, cliente:clienteDe(r.cliente), vendedor:vendPorNome.get(r.vendedor),
      transportadora:r.transportadora||'—', motorista:r.motorista||null, responsavel:r.responsavel||'—',
      situacao:r.situacao, situacaoAcomp:r.acomp, temCotacao:r.situacao==='EMITIDO', motivoPendencia:null,
      prazoEntrega:null, dataLimite, diasParaLimite, emAndamento, atrasada: emAndamento && diasParaLimite<0,
      tempoEntrega: saida ? Math.max(0, Math.round((saida-dataEmissao)/86400000)) : null,
      produto:null, divisao:null,
    };
  });
  currentPeriod = diasJanela();
  deriveStatusClientes();
}

async function carregarDadosReais(forcar){
  try{
    const resp = await fetch('/api/dashboard'+(forcar?'?refresh=1':''), {cache:'no-store'});
    if(resp.status===404) return {ok:false};
    const corpo = await resp.json().catch(()=>null);
    if(!resp.ok) return {ok:false, erro:(corpo && corpo.erro) || ('HTTP '+resp.status)};
    aplicarDadosReais(corpo);
    return {ok:true};
  }catch(e){ return {ok:false}; }
}

    schemaPanel.innerHTML = `
      <div><code>VW_PEDIDOS</code> → só pedidos (TIPO 1). Faturado = NF emitida + IDT_FATURAMENTO=1, contado pela data da NF. Valor do pedido deduplicado (a view tem 1 linha por item).</div>
      <div style="margin-top:6px;"><code>VW_CLIENTES</code> → cadastro ligado ao pedido pelo nome do cliente; UF e região derivadas do estado. Inativo = ${REGRAS.diasParaInativar}+ dias sem pedido (só quem comprou nos últimos ${REGRAS.janelaInativosMeses} meses).</div>
      <div style="margin-top:6px;">Atraso de entrega = em andamento há mais de ${REGRAS.diasLimiteEntrega} dias desde a emissão (as views não trazem prazo).</div>
      <div style="margin-top:6px;">Indisponível nas views: faturamento por produto/divisão e motivo da pendência.</div>`;
  } else {
    schemaBtn.textContent = 'Dados mockados · modelados a partir de VW_CLIENTES, pedidos e VW_PRODUTOS. Clique para ver o mapeamento.';
    schemaPanel.innerHTML = `
      <div><code>VW_CLIENTES</code> → Cliente, região, vendedor, segmento e natureza de venda usados em todos os painéis.</div>
      <div style="margin-top:6px;"><code>VW_PEDIDOS</code> (SITUACAO / SITUACAO_ACOMPANHAMENTO / COD_COT) → Faturamento, Pedidos, Vendedor, Cotações e Entregas.</div>
      <div style="margin-top:6px;"><code>VW_PRODUTOS</code> (DIVISAO) → composição do Faturamento por divisão de produto.</div>
      <div style="margin-top:6px;">Todos os valores são gerados por um algoritmo aleatório seedado — estrutura fiel às colunas reais, volumes fictícios.</div>`;
  }
}
schemaBtn.addEventListener('click', ()=> schemaPanel.classList.toggle('open'));

const refreshBtn = document.getElementById('refresh-btn');
refreshBtn.addEventListener('click', async ()=>{
  if(DADOS_REAIS){
    refreshBtn.disabled = true; refreshBtn.textContent = '↻ Atualizando…';
    const r = await carregarDadosReais(true);
    refreshBtn.disabled = false; refreshBtn.textContent = '↻ Atualizar';
    mostrarBanner(r.ok? '' : 'Não foi possível atualizar os dados do ERP'+(r.erro? ' ('+r.erro+')':'')+'. Mantendo a última carga.');
    if(r.ok){ updateBadges(); renderAllPanes(); selectPane(currentPane); }
    return;
  }
  rand = mulberry32(Date.now()>>>0);
  PEDIDOS = gerarPedidos();
  deriveStatusClientes();
  updateBadges();
  renderPane(currentPane);
});

(async function iniciar(){
  const loading = document.getElementById('loading');
  loading.style.display = 'block';
  const r = await carregarDadosReais(false);
  loading.style.display = 'none';
  if(!r.ok && r.erro) mostrarBanner('Não foi possível carregar os dados do ERP ('+r.erro+'). Exibindo dados de exemplo.');
  currentPeriod = diasJanela();
  refreshBtn.textContent = DADOS_REAIS ? '↻ Atualizar' : '↻ Nova amostra';
  descreverFonte();
  updateBadges();
  renderAllPanes();
  selectPane('faturamento');
})();

})();
</script>

</body></html>
